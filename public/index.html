<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotelDesk</title>
<style>

  @media (max-width:860px) { .split, .app { grid-template-columns:1fr; } .brand { padding:1.2rem 1.5rem; } .brand h2, .brand ul { display:none; } .side { position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; } .side .logo { margin:0; } .nav { flex-direction:row; flex-wrap:wrap; flex:1 1 100%; order:3; } .me { border:0; padding:0; margin-left:auto; } .content { padding:1.2rem; } }
</style>
</head>
