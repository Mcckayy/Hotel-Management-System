<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Portal</title>
<style>
  :root { color-scheme: dark; --bg:#0b1020; --panel:#121a33; --card:#18213f; --line:#27325a; --fg:#e9edff; --muted:#a3aed6; --accent:#7c83ff; --good:#4ade80; --bad:#ff7b86; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif; }
  h1 { font-size:1.7rem; margin:0 0 1.1rem; } h2 { font-size:1.15rem; margin:1.8rem 0 .4rem; }
  .shell { display:grid; grid-template-columns:minmax(300px,42%) 1fr; min-height:100vh; }
  .brand { background:linear-gradient(160deg,#1a2350,#0e1530 62%); padding:3rem 2.5rem; display:flex; flex-direction:column; justify-content:center; gap:1.5rem; border-right:1px solid var(--line); }
  .logo { display:flex; align-items:center; gap:.7rem; font-weight:700; font-size:1.25rem; }
  .logo i { width:2.2rem; height:2.2rem; border-radius:.6rem; background:var(--accent); display:grid; place-items:center; color:#0b1020; font-style:normal; font-weight:800; }
  .brand h2 { font-size:1.9rem; line-height:1.2; margin:0; }
  .brand ul { list-style:none; padding:0; margin:0; display:grid; gap:.8rem; color:var(--muted); }
  .brand li { padding-left:1.6rem; position:relative; }
  .brand li::before { content:""; position:absolute; left:0; top:.5em; width:.7rem; height:.7rem; border-radius:50%; background:var(--accent); }
  .brand small { color:var(--muted); }
  main { padding:3rem 2.5rem; display:grid; place-items:center; align-content:center; }
  #view { width:min(440px,100%); }
  body.in .shell { grid-template-columns:1fr; } body.in .brand { display:none; }
  body.in main { place-items:start center; padding:1.5rem; } body.in #view { width:min(1000px,100%); }
  form { display:grid; gap:1rem; }
  label { display:grid; gap:.35rem; font-weight:600; font-size:.92rem; }
  small { font-weight:400; color:var(--muted); }
  input, select { width:100%; font:inherit; font-weight:400; padding:.8rem .9rem; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:.75rem 1.1rem; background:var(--accent); color:#0b1020; cursor:pointer; }
  button:hover { background:#9298ff; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); } button.ghost:hover { background:var(--panel); }
  button.sm { padding:.4rem .8rem; font-size:.9rem; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:1.5rem; }
  .tabs button { background:transparent; color:var(--muted); } .tabs button.on { background:var(--accent); color:#0b1020; }
  .msg { min-height:1.5em; margin:1rem 0 0; color:var(--bad); } .msg.ok { color:var(--good); }
  .muted { color:var(--muted); margin:0 0 .8rem; }
  .secret { font-family:ui-monospace,Menlo,monospace; word-break:break-all; color:var(--muted); font-size:.9rem; }
  #qr { width:200px; height:200px; background:#fff; padding:8px; border-radius:12px; display:block; margin:1rem 0; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .who { display:flex; align-items:center; gap:.8rem; }
  .avatar { width:2.4rem; height:2.4rem; border-radius:50%; background:var(--accent); color:#0b1020; font-weight:800; display:grid; place-items:center; }
  .pill { display:inline-block; padding:.05rem .65rem; border-radius:999px; background:#262f5c; color:var(--accent); font-weight:700; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; }
  .banner { background:rgba(74,222,128,.12); border:1px solid rgba(74,222,128,.4); color:var(--good); padding:.8rem 1rem; border-radius:10px; font-weight:600; margin-bottom:1.25rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.25rem; }
  .card h3 { margin:0 0 .7rem; font-size:.78rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); }
  .kv { display:grid; margin-bottom:.65rem; } .k { color:var(--muted); font-size:.85rem; } .v { overflow-wrap:anywhere; }
  .good { color:var(--good); font-weight:700; } .bad { color:var(--bad); font-weight:700; }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; margin:.6rem 0; }
  table { width:100%; border-collapse:collapse; margin-top:.6rem; } th, td { text-align:left; padding:.55rem .3rem; border-bottom:1px solid var(--line); font-size:.95rem; } th { color:var(--muted); font-weight:600; }
  @media (max-width:860px) { .shell { grid-template-columns:1fr; } .brand { padding:1.25rem 1.5rem; } .brand h2, .brand ul, .brand small { display:none; } main { padding:1.5rem; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="brand">
    <div class="logo"><i>S</i>Secure Portal</div>
    <h2>Sign in safely, every time.</h2>
    <ul>
      <li>Two-factor sign-in with an authenticator app</li>
      <li>Role-based access for users, managers and admins</li>
      <li>Passwords salted, peppered and hashed</li>
      <li>Encrypted, automatic backups</li>
    </ul>
    <small>The first account created becomes the administrator.</small>
  </aside>
  <main><div id="view"></div></main>
</div>
<script>
const $ = s => document.querySelector(s), view = $('#view');
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
async function api(path, body) {
  let r;
  try {
    r = await fetch('/api/' + path, { method: body === undefined ? 'GET' : 'POST', headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch { throw new Error('Cannot reach the server. Check your internet connection and try again.'); }
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error(j?.error || `Request failed (HTTP ${r.status}). Please try again. If it keeps happening, check the Vercel function logs.`);
  return j;
}
const ui = html => { view.innerHTML = html + '<p id="msg" class="msg" role="alert"></p>'; };
const msg = (t, ok) => { const m = $('#msg'); if (m) { m.textContent = t || ''; m.className = ok ? 'msg ok' : 'msg'; } };
const fmt = s => s ? new Date(s).toLocaleString() : 'Never';

function loginView(mode = 'login') {
  document.body.classList.remove('in');
  const login = mode === 'login';
  ui(`<div class="tabs"><button type="button" id="t1" class="${login ? 'on' : ''}">Sign in</button><button type="button" id="t2" class="${login ? '' : 'on'}">Create account</button></div>
    <h1>${login ? 'Welcome back' : 'Create your account'}</h1>
    <form id="f" novalidate>
      ${login ? '' : '<label>Full name<input name="name" autocomplete="name" required></label>'}
      <label>Email address<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="${login ? 'current-password' : 'new-password'}" required>
        ${login ? '' : '<small>At least 8 characters, including a letter and a number.</small>'}</label>
      <button>${login ? 'Continue' : 'Create account'}</button>
    </form>`);
  $('#t1').onclick = () => loginView('login'); $('#t2').onclick = () => loginView('register');
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    if (!login && (d.password.length < 8 || !/[A-Za-z]/.test(d.password) || !/\d/.test(d.password)))
      return msg('Password needs at least 8 characters, including a letter and a number');
    try { next(await api(login ? 'login' : 'register', d)); } catch (x) { msg(x.message); }
  };
}
const next = r => r.step === 'totp' ? codeView() : r.step === 'setup' ? setupView(r) : home(true);
const codeInput = '<label>6-digit code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>';
function codeForm(path) {
  $('#f').onsubmit = async e => {
    e.preventDefault();
    try { await api(path, Object.fromEntries(new FormData(e.target))); home(true); } catch (x) { msg(x.message); }
  };
}
function codeView() {
  document.body.classList.remove('in');
  ui(`<h1>Enter your code</h1><p class="muted">Open your authenticator app and type the current 6-digit code.</p><form id="f">${codeInput}<button>Verify</button></form>`);
  codeForm('login/totp');
}
function setupView(r) {
  document.body.classList.remove('in');
  ui(`<h1>Set up two-factor sign-in</h1><p class="muted">Scan this QR code with an authenticator app, then enter the code it shows.</p>
    <img id="qr" alt="QR code for your authenticator app"><p class="secret" id="sec"></p><form id="f">${codeInput}<button>Turn on two-factor</button></form>`);
  $('#qr').src = r.qr; $('#sec').textContent = r.secret;
  codeForm('2fa/confirm');
}

function card(title, rows) {
  const c = el('section', 'card'), h = el('h3'); h.textContent = title; c.append(h);
  for (const [k, v, tone] of rows) {
    const r = el('div', 'kv'), a = el('span', 'k'), b = el('span', 'v ' + (tone || ''));
    a.textContent = k; b.textContent = v; r.append(a, b); c.append(r);
  }
  return c;
}
async function home(justIn) {
  let me;
  try { me = await api('me'); } catch { return loginView(); }
  document.body.classList.add('in');
  const s = me.security;
  ui(`<div class="top"><div class="logo"><i>S</i>Secure Portal</div>
      <div class="who"><span class="avatar" id="av"></span><div><strong id="nm"></strong><br><span class="pill" id="rl"></span></div><button class="ghost sm" id="out">Sign out</button></div></div>
    ${justIn ? '<div class="banner" role="status" id="ok"></div>' : ''}
    <h1 id="hi"></h1><div class="grid" id="cards"></div>
    <h2>Access check</h2><p class="muted">Try the protected areas. What opens depends on your role.</p>
    <div class="row"><button class="ghost" id="mgr">Open manager area</button><button class="ghost" id="adm">Open admin area</button></div><div id="panel"></div>`);
  $('#av').textContent = me.name.trim()[0].toUpperCase(); $('#nm').textContent = me.name; $('#rl').textContent = me.role;
  if (justIn) $('#ok').textContent = `Login successful. Welcome, ${me.name}.`;
  $('#hi').textContent = (me.role === 'admin' ? 'Admin dashboard' : 'Your dashboard');
  $('#cards').append(
    card('Identity', [['Email', me.email], ['User ID', me.id]]),
    card('Access', [['Role', me.role], ['Authentication level', s.authLevel]]),
    card('Two-factor', [['Status', `Active (confirmed ${fmt(me.totp_confirmed_at)})`, 'good'], ['Last sign-in', fmt(me.last_login)]]),
    card('Password protection', [['Hashing', s.kdf], ['Salt', s.salt], ['Pepper', s.pepper]]),
    card('Secret storage', [['Pepper', s.pepperStorage], ['Authenticator secret', s.totpStorage]]));
  $('#out').onclick = async () => { await api('logout', {}); loginView(); };
  $('#mgr').onclick = async () => { try { msg((await api('manager/reports')).message, true); } catch (x) { msg(x.message); } };
  $('#adm').onclick = async () => { try { await adminPanel(me); msg('Admin area opened.', true); } catch (x) { $('#panel').replaceChildren(); msg(x.message); } };
}
async function adminPanel(me) {
  const [users, sys] = await Promise.all([api('admin/users'), api('admin/system')]);
  const wrap = el('div'), h = t => { const e = el('h2'); e.textContent = t; return e; }, grid = el('div', 'grid');
  grid.append(card('System', [['Database', 'Google Firestore (primary)', 'good'],
    ['Backups', `${sys.backups.schedule}, encrypted, keeping ${sys.backups.keep}`], ['Last backup', `${fmt(sys.backups.last)} (${sys.backups.count} stored)`],
    ['Audit log', sys.audit.ok ? 'Verified, hash chain intact' : `Tampering detected at entry ${sys.audit.brokenAt}`, sys.audit.ok ? 'good' : 'bad']]));
  const b = el('button', 'ghost'); b.textContent = 'Back up now'; b.style.marginTop = '.8rem';
  b.onclick = async () => { try { msg('Backup saved: ' + (await api('admin/backup', {})).file, true); } catch (x) { msg(x.message); } };
  const t = el('table'); t.innerHTML = '<tr><th>Name</th><th>Email</th><th>Role</th></tr>';
  for (const u of users) {
    const tr = t.insertRow(); tr.insertCell().textContent = u.name; tr.insertCell().textContent = u.email;
    const sel = el('select'); sel.setAttribute('aria-label', 'Role for ' + u.email);
    for (const r of ['user', 'manager', 'admin']) sel.add(new Option(r, r, false, r === u.role));
    sel.disabled = u.id.slice(0, 8) === me.id;
    sel.onchange = async () => { try { await api(`admin/users/${u.id}/role`, { role: sel.value }); msg('Role updated for ' + u.email, true); } catch (x) { msg(x.message); } };
    tr.insertCell().append(sel);
  }
  wrap.append(h('System'), grid, b, h('Users'), t);
  $('#panel').replaceChildren(wrap);
}
home();
</script>
</body>
</html>
